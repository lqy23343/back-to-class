<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>回到课堂</title>
<meta name="theme-color" content="#2b664f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="回到课堂">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: one phone-width column read like a class timetable sheet — ruled rows, 节次 in mono on the left, chalkboard green as the only accent, tab bar at the bottom. */
:root {
  --bg: #f0f3f0;
  --surface: #fbfcfb;
  --sunken: #e3e9e5;
  --ink: #16211c;
  --muted: #56665e;
  --line: #d2dbd5;
  --accent: #2b664f;
  --accent-soft: #dceae2;
  --accent-ink: #f6faf7;
  --ok: #287b48;
  --ok-soft: #dcefe2;
  --warn: #8f5a12;
  --warn-soft: #f5e8cf;
  --bad: #ad3622;
  --bad-soft: #f6dfd9;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131d18; --surface: #1a2721; --sunken: #23342b; --ink: #e6eee8; --muted: #9cafa5; --line: #2d3f36;
    --accent: #80c6a6; --accent-soft: #213b2f; --accent-ink: #0e1c15;
    --ok: #6bd08f; --ok-soft: #1d3a29; --warn: #e2ac57; --warn-soft: #3a2f1d; --bad: #f0846c; --bad-soft: #42251e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131d18; --surface: #1a2721; --sunken: #23342b; --ink: #e6eee8; --muted: #9cafa5; --line: #2d3f36;
  --accent: #80c6a6; --accent-soft: #213b2f; --accent-ink: #0e1c15;
  --ok: #6bd08f; --ok-soft: #1d3a29; --warn: #e2ac57; --warn-soft: #3a2f1d; --bad: #f0846c; --bad-soft: #42251e;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 6px 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .06em; }
.dateline { font-family: var(--font-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.banner { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }

#view { display: grid; gap: 26px; }
.block { display: grid; gap: 10px; min-width: 0; }
.h1 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.3; margin: 0; text-wrap: balance; }
.h { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.4; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); margin: 0; }
.note { margin: 0; color: var(--muted); }
.row-between { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.row-end { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stack { display: grid; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 999px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 9px 16px; border-radius: 8px; font-weight: 600; line-height: 1.3; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.sm { padding: 5px 11px; font-size: 13px; font-weight: 500; }
.btn.wide { width: 100%; }

label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input:not([type="checkbox"]), select, textarea { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 10px; font-size: 15px; }
textarea { resize: vertical; }
.inline-form { display: flex; gap: 8px; }
.inline-form input { flex: 1; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }

.minstep { border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 14px; display: grid; gap: 6px; justify-items: start; }
.minstep-k { font-size: 13px; color: var(--muted); }
.minstep-v { font-size: 18px; font-weight: 600; }
.care { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 4px; font-size: 14px; }

.sheet { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.sheet-row { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.period { display: grid; align-content: start; font-family: var(--font-data); font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.period small { color: var(--muted); font-size: 12px; }
.sheet-main { min-width: 0; display: grid; gap: 2px; }
.cname { font-weight: 600; overflow-wrap: anywhere; }
.seg { grid-column: 2; justify-self: start; display: inline-flex; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--muted); padding: 6px 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on.present { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.seg button.on.leave { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.seg button.on.absent { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.row-actions { grid-column: 2; display: flex; gap: 8px; margin-top: 6px; }
.day-h { margin-top: 4px; }

.meter { display: grid; gap: 3px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.meter-bar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.meter-bar i { display: block; height: 100%; background: var(--ok); }
.meter.warn .meter-bar i { background: var(--warn); }
.meter.bad .meter-bar i, .meter.over .meter-bar i { background: var(--bad); }
.meter.over span { color: var(--bad); font-weight: 600; }

.timer-face { font-family: var(--font-data); font-weight: 600; font-size: clamp(52px, 17vw, 76px); line-height: 1; text-align: center; font-variant-numeric: tabular-nums; padding-block: 8px 2px; }
.timer-sub { text-align: center; color: var(--muted); font-size: 13px; min-height: 1.6em; }
.timer-controls { display: grid; gap: 10px; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; }
.wk-col { display: grid; gap: 4px; justify-items: center; }
.wk-min { font-family: var(--font-data); font-size: 11px; color: var(--muted); min-height: 1.3em; font-variant-numeric: tabular-nums; }
.wk-bar { width: 100%; max-width: 30px; height: 56px; background: var(--sunken); border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden; }
.wk-bar i { display: block; width: 100%; background: var(--accent); }
.wk-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 6px; max-width: 30px; }
.wk-dots b, .legend b { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
b.p { background: var(--ok); }
b.l { background: var(--warn); }
b.m { background: var(--bad); }
.wk-label { font-size: 12px; color: var(--muted); }
.wk-col.today .wk-label { color: var(--accent); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--accent); }

.todos { list-style: none; margin: 0; padding: 0; display: grid; }
.todos li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.todo { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 15px; min-width: 0; }
.todo input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.todo span { overflow-wrap: anywhere; }
.done { text-decoration: line-through; color: var(--muted); }
.x { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 4px 6px; flex: none; }

.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 6px; justify-items: start; }

.credit-card { display: grid; gap: 6px; }
.big { font-family: var(--font-data); font-weight: 600; font-size: 42px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big small { font-size: 16px; color: var(--muted); font-weight: 500; }
.cbar { position: relative; height: 12px; background: var(--sunken); border-radius: 6px; margin-block: 26px 10px; }
.cbar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 6px; }
.tick { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); }
.tick span { position: absolute; bottom: calc(100% + 3px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--font-data); font-size: 11px; font-weight: 600; color: var(--muted); }
.tick.end span { left: auto; right: 0; transform: none; }
.facts { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.facts strong { color: var(--ink); }

.group-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.courses { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.course { border-bottom: 1px solid var(--line); }
.course-head { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 11px 0; background: none; border: 0; text-align: left; color: var(--ink); }
.credits { font-family: var(--font-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.st { font-size: 12px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.st.enrolled { color: var(--accent); border-color: var(--accent); }
.st.passed { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.st.skip { text-decoration: line-through; }
.editor { display: grid; gap: 10px; padding: 2px 0 14px; }
.rules { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.rule-line { margin: 0; font-size: 13px; color: var(--warn); }

.note-groups { display: grid; gap: 24px; }
.note-group { display: grid; gap: 10px; min-width: 0; }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.note-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.note-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.note-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.answer { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sunken); border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.7; }
.note-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px; background: none; border: 0; color: var(--muted); font-size: 12px; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--accent); font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(74px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; box-shadow: 0 4px 16px rgba(0, 0, 0, .18); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">回到课堂</div>
    <div class="dateline" id="dateline"></div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<nav class="tabbar" aria-label="切换页面">
  <div class="tabbar-inner" role="tablist">
    <button class="tab" role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M9 3v4M15 3v4"/><circle cx="12" cy="14.5" r="1.5"/></svg>今天</button>
    <button class="tab" role="tab" data-tab="timetable" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M3.5 15h17M9.5 4v16M15 4v16"/></svg>课表</button>
    <button class="tab" role="tab" data-tab="credits" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M10 20V9M15 20v-4M20 20V5"/></svg>学分</button>
    <button class="tab" role="tab" data-tab="notes" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v12h-8l-6 4z"/><path d="M10.2 8.6a1.9 1.9 0 1 1 2.5 1.8c-.4.2-.7.5-.7.9v.5M12 13.7v.1"/></svg>问题本</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  'use strict';

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const WD = ['日', '一', '二', '三', '四', '五', '六'];
  const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const fmt = (n) => String(Math.round(Number(n) * 100) / 100);
  // Dates follow China time (UTC+8) whatever zone the device is set to, so a phone in China and a
  // computer set to another zone agree on what "today" is. cn(ms) is a Date whose local getters read China time.
  const cn = (ms) => {
    const t = ms == null ? Date.now() : Number(ms);
    const d = new Date(t + (480 + new Date(t).getTimezoneOffset()) * 60000);
    const fix = new Date(t).getTimezoneOffset() - d.getTimezoneOffset(); // the device's DST switched in between
    return fix ? new Date(d.getTime() - fix * 60000) : d;
  };
  const isoWd = (d) => (d.getDay() === 0 ? 7 : d.getDay());
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());

  const LS = 'hdkt:';
  const lget = (k, f) => { try { const v = localStorage.getItem(LS + k); return v == null ? f : JSON.parse(v); } catch (e) { return f; } };
  const lset = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  const ldel = (k) => { try { localStorage.removeItem(LS + k); } catch (e) { /* storage unavailable */ } };
  const storageOk = (() => { try { localStorage.setItem(LS + 'probe', '1'); localStorage.removeItem(LS + 'probe'); return true; } catch (e) { return false; } })();

  const PATHS = { courses: 'app/courses', timetable: 'app/timetable', settings: 'app/settings', notes: 'app/notes' };
  const STATUS = [['todo', '待报名'], ['enrolled', '在修'], ['passed', '已过'], ['skip', '不重修']];
  const GROUPS = [
    ['fall', '秋季学期开的', '这学期就能重修或跟班上。'],
    ['spring', '春季学期开的', '下学期再修。'],
    ['pe', '体育', '必修，不能免修，不及格没有补考，只能重修。'],
    ['other', '我加的课', ''],
    ['elective', '任选课', '不一定要重修，也可以换别的任选课凑学分。'],
  ];
  const FORM_IDS = ['cfCourse', 'cfNewName', 'cfNewHours', 'cfWeekday', 'cfTime', 'cfStart', 'cfEnd', 'cfPlace', 'cfParity', 'cfWeekFrom', 'cfWeekTo'];
  const NOTES_ALL = '*'; // 问题本 shows every course; '' is the group of notes with no course

  const S = {
    mode: 'loading',
    loaded: { courses: false, timetable: false, settings: false, notes: false, logs: false },
    courses: [], timetable: [], settings: {}, notes: [], logs: {},
    readOnly: false, confirmImport: false, confirmSyncOff: false,
    tab: lget('tab', 'today'),
    openCourse: null, addingClass: false, editClass: null, confirmDel: null,
    notesCourse: NOTES_ALL, noteEdit: null, copyFallback: null, lastNoteCourse: '',
    timerSel: lget('timerSel', { courseId: '', minutes: 25 }),
  };
  if (!['today', 'timetable', 'credits', 'notes'].includes(S.tab)) S.tab = 'today';
  if (![15, 25, 45].includes(S.timerSel.minutes)) S.timerSel.minutes = 25;
  let T = lget('timer', null);
  const clearOnRender = new Set();
  const ready = () => S.mode !== 'loading' && Object.values(S.loaded).every(Boolean);

  /* ---------- storage: this device's browser first (localStorage); optional sync with a private GitHub repo ---------- */
  const LIST_KEYS = ['courses', 'timetable', 'notes'];
  const LIST_FIELD = { courses: 'list', timetable: 'classes', notes: 'items' };
  const listOf = (key) => (key === 'courses' ? S.courses : key === 'timetable' ? S.timetable : S.notes);
  const isObj = (o) => !!o && typeof o === 'object' && !Array.isArray(o);
  const emptyMeta = () => ({ lists: { courses: { u: {}, del: {} }, timetable: { u: {}, del: {} }, notes: { u: {}, del: {} } }, settings: 0, days: {} });
  function loadMeta() {
    const m = lget('meta', null);
    const e = emptyMeta();
    if (!isObj(m)) return e;
    LIST_KEYS.forEach((k) => {
      const l = isObj(m.lists) && isObj(m.lists[k]) ? m.lists[k] : {};
      e.lists[k] = { u: isObj(l.u) ? l.u : {}, del: isObj(l.del) ? l.del : {} };
    });
    e.settings = Number(m.settings) || 0;
    e.days = isObj(m.days) ? m.days : {};
    return e;
  }
  // META remembers when each piece last changed, so two devices can be merged piece by piece:
  // list items by id (newer wins, deletions kept as tombstones), settings as a whole, and per day:
  // energy, todos, each class's attendance; focus sessions are only ever added, so they are unioned.
  let META = loadMeta();
  const saveMeta = () => lset('meta', META);
  function docBody(key) {
    if (key === 'courses') return { list: S.courses };
    if (key === 'timetable') return { classes: S.timetable };
    if (key === 'notes') return { items: S.notes };
    return Object.assign({}, S.settings);
  }
  function saveFailed() { toast('没存上：这个浏览器存不了记录，或者存储空间满了。'); }
  // Compare with what is stored and stamp what changed. Must run before the new version is written.
  function stamp(key, now) {
    if (key === 'settings') {
      if (JSON.stringify(lget('doc:' + PATHS.settings, {})) !== JSON.stringify(docBody('settings'))) META.settings = now;
      return;
    }
    const prevDoc = lget('doc:' + PATHS[key], null);
    const prevList = ((prevDoc && prevDoc[LIST_FIELD[key]]) || []).filter((x) => isObj(x) && x.id != null);
    const prev = new Map(prevList.map((x) => [String(x.id), JSON.stringify(x)]));
    const m = META.lists[key];
    const seen = new Set();
    listOf(key).forEach((x) => {
      if (!isObj(x) || x.id == null) return;
      const id = String(x.id);
      seen.add(id);

      else if (el.tagName !== 'SELECT' || Array.from(el.options).some((o) => o.value === v.v)) el.value = v.v;
    });
    if (saved.focus) {
      const el = document.getElementById(saved.focus.id);
      if (el) {
        el.focus({ preventScroll: true });
        if (saved.focus.s != null) { try { el.setSelectionRange(saved.focus.s, saved.focus.e); } catch (err) { /* ignore */ } }
      }
    }
  }
  function render() {
    document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
    const now = cn();
    const wk = weekNo(now);
    const dl = $('#dateline');
    dl.dataset.base = `${now.getMonth() + 1}月${now.getDate()}日 周${WD[now.getDay()]}${wk ? ` · 第${wk}周` : ''}`;
    dl.textContent = dl.dataset.base + syncBadge();
    $('#banner').innerHTML = bannerHtml();
    const view = $('#view');
    const saved = captureInputs(view);
    let html;
    if (!ready()) html = `<p class="muted">正在读取你的记录…</p>`;
    else if (S.tab === 'timetable') html = viewTimetable();
    else if (S.tab === 'credits') html = viewCredits();
    else if (S.tab === 'notes') html = viewNotes();
    else html = viewToday();
    view.innerHTML = html;
    restoreInputs(saved);
    syncNewCourse();
    paintTimer();
  }
  function bannerHtml() {
    if (!storageOk) return `<div class="banner">这个浏览器存不了记录（可能开着无痕模式），关掉页面记录就没了。换成普通模式或者别的浏览器再打开。</div>`;
    if (ready() && !hasData() && !syncOn() && S.tab !== 'credits') return `<div class="banner">第一次打开：到「学分」页最下面填上 GitHub 令牌，你的课程和记录会自动同步过来。</div>`;
    return '';
  }

  /* today */
  function viewToday() {
    const now = cn();
    const dk = dayKey(now);
    const day = getDay(dk);
    const classes = classesOn(now);
    const energy = day.energy || null;
    const opts = [['ok', '还可以'], ['tired', '有点累'], ['very', '很累，不想动']];
    let h = `<section class="block">
      <h2 class="h">今天感觉怎么样？</h2>
      <div class="chips" role="group" aria-label="今天的状态">${opts.map(([k, l]) => `<button class="chip${energy === k ? ' on' : ''}" data-act="energy" data-v="${k}" aria-pressed="${energy === k}">${l}</button>`).join('')}</div>
      ${energyNote(energy, classes, day)}
      ${tiredCare(now)}
    </section>`;
    h += `<section class="block"><div class="row-between"><h2 class="h">今天的课</h2>${classes.length ? '<span class="sub">到了就点一下</span>' : ''}</div>`;
    if (!S.timetable.length) h += `<div class="empty"><strong>还没填课表</strong><span class="sub">照着教务系统把这学期的课填进「课表」，这里每天会列出当天的课。</span><button class="btn" data-act="goto" data-v="timetable">去填课表</button></div>`;
    else if (!classes.length) h += `<p class="muted">今天没有课。</p>`;
    else h += `<ol class="sheet">${classes.map((c) => classRow(c, day)).join('')}</ol>`;
    h += `</section>`;
    h += timerCard(dk);
    const weekMin = weekDays(now).reduce((s, d) => s + focusMinutes(dayKey(d)), 0);
    h += `<section class="block"><div class="row-between"><h2 class="h">这一周</h2><span class="sub">本周专心学了 ${weekMin} 分钟</span></div>${weekStrip(now)}</section>`;
    h += todosBlock(day);
    h += `<section class="block"><h2 class="h">没听懂的，记一句</h2><form class="stack" data-form="quicknote">${noteFields('qn', S.lastNoteCourse)}</form></section>`;
    return h;
  }
  function energyNote(energy, classes, day) {
    if (energy === 'ok') return `<p class="note">好，按计划来：去上课，再专心学一段。</p>`;
    if (energy === 'tired') return `<p class="note">那今天只做最要紧的：去上课，再学一段 25 分钟。别的明天再说。</p>`;
    if (energy !== 'very') return '';
    const next = classes.find((c) => !(day.attend && day.attend[c.id] && day.attend[c.id].s));
    if (next) {
      return `<div class="minstep"><span class="minstep-k">今天只做一件事就算数</span><span class="minstep-v">去上${periodText(next)}的${esc(courseName(next.courseId) || '课')}</span><span class="sub">${next.place ? esc(next.place) + '。' : ''}到了就在下面点「到了」。坐在教室里听不进去也没关系，人到了就算。</span></div>`;
    }
    return `<div class="minstep"><span class="minstep-k">今天只做一件事就算数</span><span class="minstep-v">坐下来学 15 分钟</span><button class="btn" data-act="quick15">开始 15 分钟</button></div>`;
  }
  function tiredCare(now) {
    let very = 0;
    for (let i = 0; i < 14; i++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      if (getDay(dayKey(d)).energy === 'very') very++;
    }
    if (very < 10) return '';
    return `<div class="care"><strong>最近两周，大多数天你都选了「很累」。</strong><span>这种累一直不散的话，值得认真对待：可以去校医院看看睡眠和身体，也可以去学校心理咨询中心聊聊，或者打 12356（免费、保密）。</span></div>`;
  }
  function meter(course) {
    const hh = hoursOf(course);
    if (!hh) return '';
    const limit = hh.h / 3;
    const a = absences(course.id);
    const ratio = Math.min(1, a / limit);
    const level = a > limit ? 'over' : ratio >= 0.75 ? 'bad' : ratio >= 0.4 ? 'warn' : 'ok';
    const text = a > limit
      ? `缺了 ${fmt(a)} 学时，超过三分之一了：按校规不能考这门课，马上找任课老师和辅导员`
      : `缺课 ${fmt(a)} / ${fmt(limit)} 学时${hh.est ? '（估）' : ''}`;
    return `<div class="meter ${level}"><div class="meter-bar"><i style="width:${(ratio * 100).toFixed(1)}%"></i></div><span>${text}</span></div>`;
  }
  function classRow(c, day) {
    const a = day.attend && day.attend[c.id];
    const st = a && a.s;
    const name = courseName(c.courseId);
    const opts = [['present', '到了'], ['leave', '请假'], ['absent', '没去']];
    return `<li class="sheet-row">
      <div class="period"><span>${periodText(c)}</span>${c.time ? `<small>${esc(c.time)}</small>` : ''}</div>
      <div class="sheet-main"><div class="cname">${esc(name || '（这门课被删了）')}</div>${c.place ? `<div class="sub">${esc(c.place)}</div>` : ''}${meter(courseById(c.courseId))}</div>
      <div class="seg" role="group" aria-label="${esc(name)}到课情况">${opts.map(([k, l]) => `<button class="${k}${st === k ? ' on' : ''}" data-act="attend" data-id="${esc(c.id)}" data-v="${k}" aria-pressed="${st === k}">${l}</button>`).join('')}</div>
    </li>`;
  }
  function timerCard(dk) {
    let controls;
    if (!T) {
      controls = `<label>学哪门课<select id="timerCourse">${courseOptions(S.timerSel.courseId)}</select></label>
        <div class="chips" role="group" aria-label="时长">${[15, 25, 45].map((m) => `<button class="chip${S.timerSel.minutes === m ? ' on' : ''}" data-act="dur" data-v="${m}" aria-pressed="${S.timerSel.minutes === m}">${m} 分钟</button>`).join('')}</div>
        <button class="btn wide" data-act="tstart">开始</button>`;
    } else {
      controls = `<div class="row-2">${T.running ? '<button class="btn ghost" data-act="tpause">暂停</button>' : '<button class="btn" data-act="tresume">继续</button>'}<button class="btn ghost" data-act="tstop">结束</button></div>`;
    }
    return `<section class="block card">
      <div class="row-between"><h2 class="h">专心学一段</h2><span class="sub">今天 ${focusMinutes(dk)} 分钟</span></div>
      <div class="timer-face" id="timerFace">${pad(S.timerSel.minutes)}:00</div>
      <div class="timer-sub" id="timerSub"></div>
      <div class="timer-controls">${controls}</div>
    </section>`;
  }
  function weekStrip(now) {
    const today = dayKey(now);
    const days = weekDays(now).map((d) => {
      const dk = dayKey(d);
      const att = Object.values(getDay(dk).attend || {}).filter((a) => a && a.s);
      return {
        d, dk, min: focusMinutes(dk),
        p: att.filter((a) => a.s === 'present').length,
        l: att.filter((a) => a.s === 'leave').length,
        m: att.filter((a) => a.s === 'absent').length,
      };
    });
    const max = Math.max(30, ...days.map((x) => x.min));
    const dots = (n, cls) => `<b class="${cls}"></b>`.repeat(Math.min(n, 4));
    return `<div class="week" role="img" aria-label="本周每天的到课情况和专心学习分钟">${days.map((x) => `<div class="wk-col${x.dk === today ? ' today' : ''}">
        <span class="wk-min">${x.min || ''}</span>
        <div class="wk-bar"><i style="height:${Math.round((x.min / max) * 100)}%"></i></div>
        <div class="wk-dots">${dots(x.p, 'p')}${dots(x.l, 'l')}${dots(x.m, 'm')}</div>
        <span class="wk-label">${WD[x.d.getDay()]}</span>
      </div>`).join('')}</div>
      <div class="legend"><span><b class="p"></b>到课</span><span><b class="l"></b>请假</span><span><b class="m"></b>没去</span><span><i class="swatch"></i>专心学的分钟</span></div>`;

    const form = todos.length < 3

  }
  function noteFields(p, sel) {
    return `<label>哪门课<select id="${p}Course">${courseOptions(sel)}</select></label>
      <textarea id="${p}Text" rows="2" maxlength="300" placeholder="比如：TCP 三次握手为什么不能只握两次？" aria-label="没听懂的地方"></textarea>
      <button class="btn">记到问题本</button>`;
  }

  /* timetable */
  function weeksText(c) {
    const parts = [];
    if (c.weekFrom || c.weekTo) parts.push(`${c.weekFrom || 1}-${c.weekTo || '?'}周`);
    if (c.parity === 'odd') parts.push('单周');

  }
  function ttRow(c) {
    const confirm = S.confirmDel === 'class:' + c.id;

      <div class="period"><span>${periodText(c)}</span>${c.time ? `<small>${esc(c.time)}</small>` : ''}</div>

      <div class="row-actions"><button class="btn ghost sm" data-act="class-edit" data-id="${esc(c.id)}">改</button><button class="btn ${confirm ? 'danger' : 'ghost'} sm" data-act="class-del" data-id="${esc(c.id)}">${confirm ? '确定删掉' : '删'}</button></div>
    </li>`;
  }
  function classForm() {
    const c = (S.editClass && S.timetable.find((x) => x.id === S.editClass)) || {};
    const sel = c.courseId || '';
    const list = S.courses.filter((x) => (x.status !== 'passed' && x.status !== 'skip') || x.id === sel);
    const options = list.map((x) => `<option value="${esc(x.id)}"${x.id === sel ? ' selected' : ''}>${esc(x.short || x.name)}</option>`).join('');
    const wd = Number(c.weekday) || isoWd(cn());
    return `<form class="card editor" data-form="class">
      <h2 class="h">${S.editClass ? '改这节课' : '添加一节课'}</h2>
      <label>课程<select id="cfCourse">${options}<option value="__new"${list.length ? '' : ' selected'}>其他课（手动填）</option></select></label>
      <div id="cfNewWrap" class="grid2"${list.length ? ' hidden' : ''}>
        <label>课程名<input id="cfNewName" maxlength="40" placeholder="课程名" autocomplete="off"></label>
        <label>总学时<input id="cfNewHours" type="number" min="1" step="1" inputmode="numeric" placeholder="如 48"></label>
      </div>
      <div class="grid2">
        <label>星期<select id="cfWeekday">${[1, 2, 3, 4, 5, 6, 7].map((d) => `<option value="${d}"${wd === d ? ' selected' : ''}>周${WD[d % 7]}</option>`).join('')}</select></label>
        <label>开始时间（可不填）<input id="cfTime" type="time" value="${esc(c.time || '')}"></label>

        <label>单双周<select id="cfParity"><option value="all">每周</option><option value="odd"${c.parity === 'odd' ? ' selected' : ''}>单周</option><option value="even"${c.parity === 'even' ? ' selected' : ''}>双周</option></select></label>
        <label>第几周开始<input id="cfWeekFrom" type="number" min="1" max="25" inputmode="numeric" value="${esc(c.weekFrom || '')}" placeholder="不填就是每周"></label>
        <label>第几周结束<input id="cfWeekTo" type="number" min="1" max="25" inputmode="numeric" value="${esc(c.weekTo || '')}" placeholder="不填就是每周"></label>

  function syncNewCourse() {

    if (sel && wrap) wrap.hidden = sel.value !== '__new';
  }
  function viewTimetable() {
    const wk = weekNo(cn());
    let h = `<section class="block"><h1 class="h1">课表</h1>
      <p class="muted">照着教务系统里这学期的课表填。每节课在「今天」页打卡，缺课会自动累计。</p>
      <p class="rule-line">缺课（病假、事假都算）超过这门课学时的三分之一，就不能参加考试。</p>
      <p class="sub">每门课的总学时先按 1 学分 16 学时估（体育按 32），标着「估」。在「学分」里点开那门课，可以改成课程大纲上的数。</p></section>`;
    const days = [1, 2, 3, 4, 5, 6, 7]
      .map((wd) => ({ wd, list: S.timetable.filter((c) => Number(c.weekday) === wd).sort((a, b) => Number(a.start) - Number(b.start)) }))
      .filter((x) => x.list.length);

    if (!days.length) h += `<div class="empty"><strong>还没有课</strong><span class="sub">点下面的「添加一节课」，一节一节填。同一门课一周上两次，就填两节。</span></div>`;
    days.forEach(({ wd, list }) => { h += `<h2 class="h day-h">周${WD[wd % 7]}</h2><ol class="sheet">${list.map(ttRow).join('')}</ol>`; });

      <form class="inline-form" data-form="sem"><input type="date" id="semStart" value="${esc(S.settings.semesterStart || '')}" aria-label="第 1 周周一"><button class="btn">保存</button></form>
      ${wk ? `<p class="sub">今天是第 ${wk} 周。</p>` : ''}

  /* credits */
  function statusChip(c) {

  function courseEditor(c) {

      </div>

  function courseRow(c) {

  function viewCredits() {
    if (!S.courses.length && S.settings.baseEarned == null) {
      return `<section class="block"><h1 class="h1">学分</h1><div class="empty"><strong>${syncOn() ? (SYN.busy ? '正在从 GitHub 同步…' : '还没有课程清单') : '课程清单还没同步过来'}</strong><span class="sub">${syncOn() ? '同步好以后，课程清单和学分会出现在这里。' : '在下面「手机电脑同步」里填上 GitHub 令牌，课程清单会自动同步过来；也可以用备份导入。'}</span></div></section>` + syncBlock() + backupBlock();
    }
    const got = earnedCredits();
    const gate = Number(S.settings.gateCredits) || 100;
    const grad = Number(S.settings.gradCredits) || 160;
    const g = gpaEstimate();
    let h = `<section class="block"><h1 class="h1">学分</h1>
      <div class="card credit-card">
        <div class="big">${fmt(got)}<small> / ${grad} 学分</small></div>
        <div class="cbar" role="img" aria-label="已获 ${fmt(got)} 学分，毕设线 ${gate}，毕业要 ${grad}">
          <i style="width:${Math.min(100, (got / grad) * 100).toFixed(1)}%"></i>
          <span class="tick" style="left:${((gate / grad) * 100).toFixed(2)}%"><span>毕设线 ${gate}</span></span>
          <span class="tick end" style="left:100%"><span>毕业 ${grad}</span></span>
        </div>
        <ul class="facts">
          <li>${got > gate ? `已经超过 ${gate}，明年可以进毕业环节。` : `明年 9 月开学（补考结束后），已获学分要<strong>超过 ${gate}</strong>，现在是 ${fmt(got)}。不够就不能做毕设，只能延期毕业。`}</li>
          <li>毕业要 ${grad}，还差 ${fmt(Math.max(0, grad - got))}。</li>
          ${g ? `<li>学位绩点估算 <strong>${g.v.toFixed(2)}</strong>（每门按最高成绩算${g.assumed ? '，没填成绩的按 60 分算' : ''}）。学位有没有绩点线，问辅导员。</li>` : ''}
        </ul>
      </div>
    </section>`;
    GROUPS.forEach(([k, title, hint]) => {
      const list = S.courses.filter((c) => (c.group || 'other') === k);
      if (!list.length) return;
      const open = list.filter((c) => c.status !== 'passed' && c.status !== 'skip');

  /* ---------- timer ---------- */
  let tickH = null;

  function paintTimer() {

    if (!face) return;
    if (!T) {
      face.textContent = `${pad(S.timerSel.minutes)}:00`;
      if (sub) sub.textContent = '选好课和时长，点开始。手机可以放远一点。';
      return;
    }
    const rem = T.running ? Math.max(0, T.endAt - Date.now()) : T.rem;
    const s = Math.ceil(rem / 1000);
    face.textContent = `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
    if (sub) {
      const name = T.c ? courseName(T.c) : '';
      if (T.running) {
        const end = cn(T.endAt);
        sub.textContent = `${name ? name + ' · ' : ''}${pad(end.getHours())}:${pad(end.getMinutes())} 结束`;
      } else {
        sub.textContent = `${name ? name + ' · ' : ''}暂停中`;
      }
    }
  }
  const saveTimer = () => { if (T) lset('timer', T); else ldel('timer'); };
  function stopTick() { if (tickH) { clearInterval(tickH); tickH = null; } }
  function startTick() { stopTick(); tickH = setInterval(tick, 500); }
  function tick() {
    if (!T || !T.running) { stopTick(); return; }
    if (Date.now() >= T.endAt && ready()) completeTimer(false);
    else paintTimer();
  }
  async function requestWake() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen');
    } catch (e) { wake = null; }
  }
  function releaseWake() {
    try { if (wake) wake.release(); } catch (e) { /* ignore */ }
    wake = null;
  }
  function primeAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!ac) ac = new AC();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function chime() {
    try {
      if (!ac) return;
      const t0 = ac.currentTime;
      [523.25, 659.25, 783.99].forEach((f, i) => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        const t = t0 + i * 0.22;
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.connect(g);
        g.connect(ac.destination);
        o.start(t);
        o.stop(t + 0.55);
      });
    } catch (e) { /* no audio */ }
  }
  function logFocus(c, m, at) {
    const d = cn(at);
    const dk = dayKey(d);

  function startTimer(courseId, minutes) {
    if (!ready() || S.readOnly) return;
    primeAudio();

    saveTimer();
    startTick();
    requestWake();
    render();
  }
  function pauseTimer() {
    if (!T || !T.running) return;
    T.rem = Math.max(0, T.endAt - Date.now());
    T.running = false;

  }
  function resumeTimer() {
    if (!T || T.running) return;
    primeAudio();
    T.endAt = Date.now() + T.rem;
    T.running = true;
    saveTimer(); startTick(); requestWake(); render();
  }
  function stopTimer() {
    if (!T) return;
    const remMs = T.running ? Math.max(0, T.endAt - Date.now()) : T.rem;
    const doneMin = Math.floor((T.m * 60000 - remMs) / 60000);
    const c = T.c;
    T = null;
    saveTimer(); stopTick(); releaseWake();
    if (doneMin >= 5) { logFocus(c, doneMin, Date.now()); toast(`记上了：${doneMin} 分钟`); }

    render();
  }
  function completeTimer(silent) {

      } else {
        const co = courseById(courseId);
        if (co && co.status === 'todo') { co.status = 'enrolled'; coursesChanged = true; }
      }
      const wf = parseInt(v('cfWeekFrom'), 10);
      const wt = parseInt(v('cfWeekTo'), 10);
      const item = {
        id: S.editClass || 'k' + uid(),
        courseId,
        weekday: Number(v('cfWeekday')) || 1,
        start, end,
        time: v('cfTime') || '',
        place: v('cfPlace').trim(),
        parity: v('cfParity') || 'all',
        weekFrom: wf > 0 ? wf : null,
        weekTo: wt > 0 ? wt : null,
      };
      if (S.editClass) S.timetable = S.timetable.map((x) => (x.id === S.editClass ? item : x));
      else S.timetable.push(item);
      S.addingClass = false;
      S.editClass = null;
      freshForm();
      saveDoc('timetable');
      if (coursesChanged) saveDoc('courses');
      toast('存好了');
      render();
    },
    sem: (f) => {
      const val = f.querySelector('input').value;
      if (val && !/^\d{4}-\d{2}-\d{2}$/.test(val)) { toast('日期格式不对。'); return; }
      S.settings = Object.assign({}, S.settings, { semesterStart: val || null });
      clearOnRender.add('semStart');
      saveDoc('settings');
      toast(val ? '开学日期存好了' : '清掉了开学日期');
      render();
    },
    import: () => {
      const ta = document.getElementById('importText');
      const text = ta ? ta.value.trim() : '';
      if (!text) { toast('先把备份粘贴进来，或者选一个备份文件。'); return; }
      const d = parseBackup(text);
      if (!d) { if (S.confirmImport) { S.confirmImport = false; render(); } return; }
      if (hasData() && !S.confirmImport) { S.confirmImport = true; render(); return; }
      S.confirmImport = false;
      if (!importData(d)) { render(); return; }
      clearOnRender.add('importText');
      S.openCourse = null; S.editClass = null; S.addingClass = false; S.copyFallback = null;
      toast(`导入好了：${S.courses.length} 门课、${S.timetable.length} 节课表、${S.notes.length} 个问题`);
      render();
    },
    sync: () => {
      const v = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
      const owner = v('syOwner');
      const repo = v('syRepo');
      const token = v('syToken');
      if (!owner || !repo) { toast('用户名和仓库名都要填。'); return; }
      if (!/^(github_pat_|ghp_|gho_)[A-Za-z0-9_]{20,}$/.test(token)) { toast('令牌看起来不对：应该是 github_pat_ 开头的一长串，复制的时候别带空格。'); return; }
      SY = Object.assign({}, SY, { owner, repo, token });
      if (!lset('sync', SY)) { saveFailed(); return; }
      clearOnRender.add('syToken');
      SYN.error = '';
      SYN.last = 0;
      render();
      syncNow(true);
    },
  };

  document.addEventListener('click', (ev) => {
    const tab = ev.target.closest('[data-tab]');
    if (tab) {
      S.tab = tab.dataset.tab;
      lset('tab', S.tab);
      S.confirmDel = null;
      S.confirmImport = false;
      render();
      window.scrollTo(0, 0);
      return;
    }
    const el = ev.target.closest('[data-act]');
    if (!el || el.type === 'checkbox') return;
    const act = el.dataset.act;
    if (!/del$/.test(act)) S.confirmDel = null;
    if (act !== 'syncoff') S.confirmSyncOff = false;
    const fn = ACT[act];
    if (fn && ready()) { ev.preventDefault(); fn(el); }
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.matches('input[type="checkbox"][data-act]')) { const fn = ACT[el.dataset.act]; if (fn && ready()) fn(el); return; }
    if (el.dataset.note) {
      const n = S.notes.find((x) => x.id === el.dataset.note);
      if (!n || !ready()) return;
      n.c = el.value;
      S.noteEdit = null;
      saveDoc('notes');
      toast(el.value ? `挪到「${courseName(el.value)}」了` : '挪到「没分课」了');
      render();
      return;
    }
    if (el.id === 'cfCourse') syncNewCourse();
    if (el.id === 'timerCourse') { S.timerSel.courseId = el.value; lset('timerSel', S.timerSel); }
    if (el.id === 'importFile' && el.files && el.files[0]) {
      const file = el.files[0];
      if (file.size > 5 * 1024 * 1024) { toast('这个文件太大了，不像是备份。'); el.value = ''; return; }
      const r = new FileReader();
      r.onload = () => {
        const ta = document.getElementById('importText');
        if (ta) ta.value = String(r.result || '');
        toast('文件读进来了，点「导入」。');
      };
      r.onerror = () => toast('这个文件读不了。');
      r.readAsText(file);
    }
  });
  document.addEventListener('submit', (ev) => {
    const f = ev.target.closest('form[data-form]');
    if (!f) return;
    ev.preventDefault();
    if (!ready()) return;
    const fn = FORMS[f.dataset.form];
    if (fn) fn(f);
  });
  document.addEventListener('focusin', (ev) => { if (ev.target.id === 'copyBox') ev.target.select(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (T && T.running) { requestWake(); tick(); }
    render();
    if (syncOn() && Date.now() - SYN.last > 20000) syncNow(false);
  });
  window.addEventListener('online', () => scheduleSync(500));

  let lastDay = today();
  setInterval(() => { const d = today(); if (d !== lastDay) { lastDay = d; render(); } }, 60000);

  function installOffline() {
    // Only when the page comes from a website (https or localhost): cache it so it opens with no internet,
    // and give the phone what it needs to add it to the home screen as an app.
    if (!/^https?:$/.test(location.protocol) || !('serviceWorker' in navigator)) return;
    [['manifest', 'manifest.webmanifest'], ['icon', 'icon-192.png'], ['apple-touch-icon', 'icon-180.png']].forEach(([rel, href]) => {
      const l = document.createElement('link');
      l.rel = rel;
      l.href = href;
      document.head.appendChild(l);
    });
    navigator.serviceWorker.register('sw.js').catch(() => { /* no offline cache here */ });
  }
  function boot() {
    render();
    startLocal();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignore */ }
    installOffline();
    if (syncOn()) syncNow(false);
  }
  boot();
})();
</script>
